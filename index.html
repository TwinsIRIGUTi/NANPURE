<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWINS SUDOKU (10k Edition)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sudoku: {
                            bg: '#f3f4f6',
                            board: '#ffffff',
                            border: '#1e293b',
                            cellSelected: '#bfdbfe',
                            cellHighlight: '#eff6ff',
                            cellSameNumber: '#dbeafe',
                            cellMultiSelected: '#e9d5ff',
                            cellError: '#fee2e2',
                            keypadBg: '#e5e7eb',
                            keypadBtn: '#ffffff',
                            keypadActive: '#3b82f6',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        input, button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col justify-between select-none relative">

    <!-- ==================== TITLE SCREEN OVERLAY ==================== -->
    <div id="title-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-between p-8 text-white">
        <div class="flex-1 flex flex-col items-center justify-center text-center space-y-4">
            <!-- Large Title -->
            <h1 class="text-4xl sm:text-6xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 drop-shadow-lg">
                TWINS SUDOKU
            </h1>
            <p class="text-sm sm:text-base text-slate-400 font-medium tracking-widest">
                10,000 PUZZLES CHALLENGE
            </p>

            <!-- Decorative Sudoku Grid Icon -->
            <div class="w-24 h-24 sm:w-32 sm:32 my-6 grid grid-cols-3 gap-1 p-2 bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl">
                <div class="bg-blue-500/20 border border-blue-400/40 rounded flex items-center justify-center font-bold text-blue-300 text-lg">9</div>
                <div class="bg-slate-700/50 rounded"></div>
                <div class="bg-purple-500/20 border border-purple-400/40 rounded flex items-center justify-center font-bold text-purple-300 text-lg">3</div>
                <div class="bg-slate-700/50 rounded"></div>
                <div class="bg-emerald-500/20 border border-emerald-400/40 rounded flex items-center justify-center font-bold text-emerald-300 text-lg">5</div>
                <div class="bg-slate-700/50 rounded"></div>
                <div class="bg-indigo-500/20 border border-indigo-400/40 rounded flex items-center justify-center font-bold text-indigo-300 text-lg">1</div>
                <div class="bg-slate-700/50 rounded"></div>
                <div class="bg-amber-500/20 border border-amber-400/40 rounded flex items-center justify-center font-bold text-amber-300 text-lg">7</div>
            </div>
        </div>

        <!-- Title Screen Buttons -->
        <div class="w-full max-w-xs space-y-3 mb-8">
            <button id="start-game-btn" class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-extrabold text-lg rounded-2xl shadow-xl transition transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>ゲームスタート</span>
            </button>
            
            <button id="title-puzzle-list-btn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl border border-slate-700 transition active:scale-95 flex items-center justify-center space-x-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
                <span>問題リスト・実績 (10,000問)</span>
            </button>
        </div>

        <div class="text-xs text-slate-500 font-mono">
            TWINS SUDOKU v1.0
        </div>
    </div>

    <!-- ==================== GAME HEADER ==================== -->
    <header class="flex items-center justify-between px-4 py-3 bg-white shadow-sm border-b border-slate-200">
        <div class="flex items-center space-x-3">
            <button id="pause-btn" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition active:scale-95" title="一時停止">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
            <div class="flex items-center space-x-1.5 font-mono text-lg font-semibold text-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="timer-display">00:00</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button id="select-puzzle-btn" class="px-3 py-1.5 bg-slate-700 text-white rounded-lg text-sm font-medium shadow hover:bg-slate-800 transition active:scale-95 flex items-center space-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
                <span>問題リスト (10k)</span>
            </button>
            <button id="new-game-btn" class="px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm font-medium shadow hover:bg-blue-600 transition active:scale-95 flex items-center space-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>新ゲーム</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-2 max-w-lg mx-auto w-full overflow-hidden">
        
        <!-- Level & Game Info Bar with # Numbering -->
        <div class="w-full flex justify-between items-center px-2 mb-2 text-xs font-semibold text-slate-500">
            <div id="level-display" class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full uppercase tracking-wider">Lv. 1 簡単</div>
            <div id="puzzle-id" class="font-mono text-slate-600 text-sm font-bold bg-slate-200 px-2 py-0.5 rounded">#1001</div>
        </div>

        <!-- Sudoku Board Wrapper with distinct 3x3 block borders -->
        <div class="relative aspect-square w-full max-w-[380px] bg-slate-900 p-2 rounded-xl shadow-xl">
            <div id="sudoku-board" class="grid grid-cols-9 grid-rows-9 w-full h-full bg-slate-700 rounded-lg overflow-hidden gap-[1px]">
                <!-- Cells generated dynamically -->
            </div>

            <!-- Pause Overlay -->
            <div id="pause-overlay" class="absolute inset-0 bg-slate-900/90 backdrop-blur-md z-20 flex flex-col items-center justify-center space-y-4 p-6 hidden">
                <div class="text-2xl font-bold text-white mb-2 tracking-wide">PAUSE</div>
                <div class="w-full max-w-xs space-y-3">
                    <button id="resume-btn" class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        </svg>
                        <span>ゲームを続ける</span>
                    </button>
                    <button id="return-title-btn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl border border-slate-700 transition active:scale-95 flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        <span>タイトルに戻る</span>
                    </button>
                </div>
            </div>

            <!-- Win Overlay -->
            <div id="win-overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center text-white hidden">
                <div class="text-4xl font-extrabold mb-2 text-yellow-400">🎉 CLEAR! 🎉</div>
                <p id="win-time" class="text-lg text-slate-200 mb-6 font-mono">タイム: 02:45</p>
                <button id="play-again-btn" class="px-6 py-3 bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold rounded-xl shadow-lg transition transform hover:scale-105 active:scale-95">問題リストに戻る</button>
            </div>
        </div>

        <div class="w-full max-w-[380px] flex items-center justify-between px-2 my-2">
            <button id="undo-btn" class="flex flex-col items-center justify-center p-2 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed flex-1 mx-0.5" title="元に戻す">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                </svg>
                <span class="text-[10px] font-medium">元に戻す</span>
            </button>

            <button id="redo-btn" class="flex flex-col items-center justify-center p-2 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed flex-1 mx-0.5" title="やり直す">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6" />
                </svg>
                <span class="text-[10px] font-medium">やり直す</span>
            </button>

            <button id="multi-select-btn" class="flex flex-col items-center justify-center p-2 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition active:scale-95 flex-1 mx-0.5 relative" title="複数選択モード">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4" />
                </svg>
                <span id="multi-select-label" class="text-[10px] font-medium">複数: OFF</span>
            </button>

            <button id="hint-btn" class="flex flex-col items-center justify-center p-2 rounded-xl bg-amber-50 shadow-sm border border-amber-200 text-amber-700 hover:bg-amber-100 transition active:scale-95 flex-1 mx-0.5 relative" title="ヒント（正解を1つ表示）">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                <span class="text-[10px] font-medium">ヒント</span>
            </button>

            <button id="erase-btn" class="flex flex-col items-center justify-center p-2 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition active:scale-95 flex-1 mx-0.5" title="消去">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span class="text-[10px] font-medium">消去</span>
            </button>

            <button id="notes-mode-btn" class="flex flex-col items-center justify-center p-2 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition active:scale-95 flex-1 mx-0.5 relative" title="不確定数字モード(メモ)">
                <div id="notes-icon-preview" class="grid grid-cols-3 gap-0.5 w-5 h-5 mb-0.5 text-[8px] font-mono leading-none text-slate-400 bg-slate-100 p-0.5 rounded">
                    <span>1</span><span>2</span><span>3</span>
                    <span>4</span><span>5</span><span>6</span>
                    <span>7</span><span>8</span><span>9</span>
                </div>
                <span id="notes-mode-label" class="text-[10px] font-medium">メモ: OFF</span>
            </button>
        </div>

        <div class="w-full max-w-[380px] grid grid-cols-9 gap-1 px-2 my-1">
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="1">
                <span>1</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="2">
                <span>2</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="3">
                <span>3</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="4">
                <span>4</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="5">
                <span>5</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="6">
                <span>6</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="7">
                <span>7</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="8">
                <span>8</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
            <button class="keypad-btn relative aspect-[3/4] bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-800 rounded-lg font-bold text-lg flex flex-col items-center justify-center shadow-sm border border-slate-200 transition transform active:scale-95" data-num="9">
                <span>9</span>
                <span class="remaining-count text-[9px] font-mono font-bold text-slate-400">9</span>
            </button>
        </div>

    </main>

    <div id="difficulty-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center px-4 hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
            <button id="close-diff-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl hidden">&times;</button>
            <h2 class="text-xl font-bold text-slate-800 mb-4 text-center">難易度を選択 (総計10,000問)</h2>
            <div class="space-y-2.5">
                <button class="difficulty-option w-full py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold rounded-xl border border-emerald-200 transition active:scale-95 flex justify-between px-4 items-center" data-level="easy">
                    <span>簡単 (#1001〜#3500)</span>
                    <span class="text-xs bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded-full">Lv. 1</span>
                </button>
                <button class="difficulty-option w-full py-3 bg-blue-50 hover:bg-blue-100 text-blue-800 font-semibold rounded-xl border border-blue-200 transition active:scale-95 flex justify-between px-4 items-center" data-level="normal">
                    <span>普通 (#3501〜#6000)</span>
                    <span class="text-xs bg-blue-200 text-blue-900 px-2 py-0.5 rounded-full">Lv. 3</span>
                </button>
                <button class="difficulty-option w-full py-3 bg-amber-50 hover:bg-amber-100 text-amber-800 font-semibold rounded-xl border border-amber-200 transition active:scale-95 flex justify-between px-4 items-center" data-level="hard">
                    <span>難しい (#6001〜#8500)</span>
                    <span class="text-xs bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">Lv. 6</span>
                </button>
                <button class="difficulty-option w-full py-3 bg-purple-50 hover:bg-purple-100 text-purple-800 font-semibold rounded-xl border border-purple-200 transition active:scale-95 flex justify-between px-4 items-center" data-level="expert">
                    <span>高難度 (#8501〜#11000)</span>
                    <span class="text-xs bg-purple-200 text-purple-900 px-2 py-0.5 rounded-full">Lv. 8</span>
                </button>
                <button class="difficulty-option w-full py-3 bg-rose-50 hover:bg-rose-100 text-rose-800 font-semibold rounded-xl border border-rose-200 transition active:scale-95 flex justify-between px-4 items-center" data-level="master">
                    <span>激ムズ (#11001〜#13500)</span>
                    <span class="text-xs bg-rose-200 text-rose-900 px-2 py-0.5 rounded-full">Lv. 10</span>
                </button>
            </div>
        </div>
    </div>

    <div id="puzzle-select-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-lg shadow-2xl flex flex-col max-h-[88vh]">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
                <h2 class="text-lg font-bold text-slate-800">10,000問 問題リスト & 実績</h2>
                <button id="close-puzzle-modal" class="text-slate-400 hover:text-slate-600 font-bold text-xl p-1">&times;</button>
            </div>
            
            <!-- Category Tabs (5 levels, each 2500 puzzles) -->
            <div class="grid grid-cols-5 gap-1 mb-2 bg-slate-100 p-1 rounded-xl">
                <button class="tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-600 bg-white shadow-sm" data-tab="easy">簡単</button>
                <button class="tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-600" data-tab="normal">普通</button>
                <button class="tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-600" data-tab="hard">難しい</button>
                <button class="tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-600" data-tab="expert">高難度</button>
                <button class="tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-600" data-tab="master">激ムズ</button>
            </div>

            <!-- Pagination bar (100 puzzles per page) -->
            <div class="flex items-center justify-between bg-slate-50 px-3 py-1.5 rounded-lg mb-2 text-xs text-slate-600">
                <button id="prev-page-btn" class="px-2.5 py-1 bg-white border border-slate-200 rounded font-semibold hover:bg-slate-100 active:scale-95 disabled:opacity-40">前へ</button>
                <span id="page-info" class="font-mono font-bold">ページ 1 / 25 (#1001〜#1100)</span>
                <button id="next-page-btn" class="px-2.5 py-1 bg-white border border-slate-200 rounded font-semibold hover:bg-slate-100 active:scale-95 disabled:opacity-40">次へ</button>
            </div>

            <!-- Puzzle Grid / List -->
            <div id="puzzle-list-container" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2 p-1 min-h-[300px]">
                <!-- Dynamically Generated Puzzle Cards -->
            </div>

            <div class="mt-3 pt-2 border-t border-slate-200 flex justify-between items-center text-xs text-slate-500">
                <span id="cleared-stats-summary">総クリア済み: 0 / 10,000 問</span>
                <div class="flex items-center space-x-2">
                    <button id="regenerate-batch-btn" class="text-blue-600 hover:underline font-semibold hidden">新しい10kセットを生成</button>
                    <button id="reset-history-btn" class="text-rose-500 hover:underline">クリア記録リセット</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let solution = [];
        let puzzle = [];
        let board = [];
        let notes = [];
        let initialClues = [];
        let selectedCell = null;
        let multiSelectMode = false;
        let selectedCellsSet = new Set();
        let notesMode = false;
        let history = [];
        let redoStack = [];
        let timerSeconds = 0;
        let timerInterval = null;
        let isPaused = false;
        let isGameOver = false;
        let currentDifficulty = 'easy';
        let currentPuzzleId = '#1001';
        let activeTab = 'easy';
        let hintUsedThisStage = false; // ヒント使用制限フラグ
        // DOM Elements
        const titleScreen = document.getElementById('title-screen');
        const startGameBtn = document.getElementById('start-game-btn');
        const titlePuzzleListBtn = document.getElementById('title-puzzle-list-btn');
        const returnTitleBtn = document.getElementById('return-title-btn');

        const boardEl = document.getElementById('sudoku-board');
        const timerDisplay = document.getElementById('timer-display');
        const eraseBtn = document.getElementById('erase-btn');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const multiSelectBtn = document.getElementById('multi-select-btn');
        const multiSelectLabel = document.getElementById('multi-select-label');
        const hintBtn = document.getElementById('hint-btn');
        const notesModeBtn = document.getElementById('notes-mode-btn');
        const notesModeLabel = document.getElementById('notes-mode-label');
        const notesIconPreview = document.getElementById('notes-icon-preview');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const pauseOverlay = document.getElementById('pause-overlay');
        const winOverlay = document.getElementById('win-overlay');
        const winTime = document.getElementById('win-time');
        const playAgainBtn = document.getElementById('play-again-btn');
        const newGameBtn = document.getElementById('new-game-btn');
        const difficultyModal = document.getElementById('difficulty-modal');
        const selectPuzzleBtn = document.getElementById('select-puzzle-btn');
        const puzzleSelectModal = document.getElementById('puzzle-select-modal');
        const closePuzzleModal = document.getElementById('close-puzzle-modal');
        const puzzleListContainer = document.getElementById('puzzle-list-container');
        const clearedStatsSummary = document.getElementById('cleared-stats-summary');
        const resetHistoryBtn = document.getElementById('reset-history-btn');
        const closeDiffModalBtn = document.getElementById('close-diff-modal-btn');
        const prevPageBtn = document.getElementById('prev-page-btn');
        const nextPageBtn = document.getElementById('next-page-btn');
        const pageInfo = document.getElementById('page-info');

        // Pseudo-random generator using seed string
        // Title Screen Logic
        startGameBtn.addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            difficultyModal.classList.remove('hidden');
            closeDiffModalBtn.classList.add('hidden');
        });

        titlePuzzleListBtn.addEventListener('click', () => {
            renderPuzzleList(activeTab, currentPage);
            puzzleSelectModal.classList.remove('hidden');
        });

        returnTitleBtn.addEventListener('click', () => {
            isPaused = false;
            stopTimer();
            pauseOverlay.classList.add('hidden');
            winOverlay.classList.add('hidden');
            difficultyModal.classList.add('hidden');
            puzzleSelectModal.classList.add('hidden');
            titleScreen.classList.remove('hidden');
        });

        pauseBtn.addEventListener('click', () => {
            if (isGameOver) return;
            isPaused = true;
            pauseOverlay.classList.remove('hidden');
        });

        resumeBtn.addEventListener('click', () => {
            isPaused = false;
            pauseOverlay.classList.add('hidden');
        });

        playAgainBtn.addEventListener('click', () => {
            winOverlay.classList.add('hidden');
            puzzleSelectModal.classList.remove('hidden');
            renderPuzzleList(activeTab, currentPage);
        });

        multiSelectBtn.addEventListener('click', () => {
            multiSelectMode = !multiSelectMode;
            if (multiSelectMode) {
                multiSelectBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600');
                multiSelectLabel.textContent = '複数: ON';
                if (selectedCell !== null) {
                    selectedCellsSet.add(selectedCell);
                }
            } else {
                multiSelectBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600');
                multiSelectLabel.textContent = '複数: OFF';
                selectedCellsSet.clear();
                if (selectedCell !== null) selectedCellsSet.add(selectedCell);
            }
            renderBoard();
        });

        notesModeBtn.addEventListener('click', () => {
            notesMode = !notesMode;
            if (notesMode) {
                notesModeBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600');
                notesModeLabel.textContent = 'メモ: ON';
                notesIconPreview.classList.remove('bg-slate-100', 'text-slate-400');
                notesIconPreview.classList.add('bg-blue-100', 'text-blue-600');
            } else {
                notesModeBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600');
                notesModeLabel.textContent = 'メモ: OFF';
                notesIconPreview.classList.remove('bg-blue-100', 'text-blue-600');
                notesIconPreview.classList.add('bg-slate-100', 'text-slate-400');
            }
        });

        function selectCell(idx) {
            if (multiSelectMode) {
                if (selectedCellsSet.has(idx)) {
                    selectedCellsSet.delete(idx);
                } else {
                    selectedCellsSet.add(idx);
                }
                selectedCell = idx;
            } else {
                selectedCellsSet.clear();
                selectedCellsSet.add(idx);
                selectedCell = idx;
            }
            renderBoard();
        }

        function handleInput(num) {
            if (isGameOver || isPaused || selectedCellsSet.size === 0) return;

            const cellsArray = Array.from(selectedCellsSet).filter(idx => !initialClues[idx]);
            if (cellsArray.length === 0) return;

            history.push({
                board: [...board],
                notes: notes.map(set => new Set(set))
            });
            redoStack = [];
            undoBtn.removeAttribute('disabled');
            redoBtn.setAttribute('disabled', 'true');

            let changed = false;
            cellsArray.forEach(idx => {
                if (notesMode) {
                    if (board[idx] === 0) {
                        if (notes[idx].has(num)) {
                            notes[idx].delete(num);
                        } else {
                            notes[idx].add(num);
                        }
                        changed = true;
                    }
                } else {
                    board[idx] = num;
                    notes[idx].clear();
                    changed = true;
                }
            });

            if (changed) {
                updateKeypadCounts();
                renderBoard();
                if (!notesMode) {
                    checkWinCondition();
                }
            }
        }

        eraseBtn.addEventListener('click', () => {
            if (isGameOver || isPaused || selectedCellsSet.size === 0) return;
            const cellsArray = Array.from(selectedCellsSet).filter(idx => !initialClues[idx]);
            if (cellsArray.length === 0) return;

            history.push({
                board: [...board],
                notes: notes.map(set => new Set(set))
            });
            redoStack = [];
            undoBtn.removeAttribute('disabled');
            redoBtn.setAttribute('disabled', 'true');

            cellsArray.forEach(idx => {
                board[idx] = 0;
                notes[idx].clear();
            });

            updateKeypadCounts();
            renderBoard();
        });

        hintBtn.addEventListener('click', () => {
            if (isGameOver || isPaused) return;
            if (hintUsedThisStage) {
                alert('ヒントは各ステージ1回のみ使用可能です。');
                return;
            }

            let targetIdx = -1;
            if (selectedCell !== null && !initialClues[selectedCell] && board[selectedCell] !== solution[selectedCell]) {
                targetIdx = selectedCell;
            } else {
                for (let i = 0; i < 81; i++) {
                    if (!initialClues[i] && board[i] !== solution[i]) {
                        targetIdx = i;
                        break;
                    }
                }
            }

            if (targetIdx === -1) return;

            hintUsedThisStage = true;
            hintBtn.classList.add('opacity-50', 'cursor-not-allowed');

            history.push({
                board: [...board],
                notes: notes.map(set => new Set(set))
            });
            redoStack = [];
            undoBtn.removeAttribute('disabled');
            redoBtn.setAttribute('disabled', 'true');

            board[targetIdx] = solution[targetIdx];
            notes[targetIdx].clear();
            selectedCell = targetIdx;
            selectedCellsSet.clear();
            selectedCellsSet.add(targetIdx);

            updateKeypadCounts();
            renderBoard();
            checkWinCondition();
        });

        undoBtn.addEventListener('click', () => {
            if (history.length === 0 || isGameOver || isPaused) return;
            redoStack.push({
                board: [...board],
                notes: notes.map(set => new Set(set))
            });
            redoBtn.removeAttribute('disabled');

            const prevState = history.pop();
            board = prevState.board;
            notes = prevState.notes;

            if (history.length === 0) {
                undoBtn.setAttribute('disabled', 'true');
            }
            updateKeypadCounts();
            renderBoard();
        });

        redoBtn.addEventListener('click', () => {
            if (redoStack.length === 0 || isGameOver || isPaused) return;
            history.push({
                board: [...board],
                notes: notes.map(set => new Set(set))
            });
            undoBtn.removeAttribute('disabled');

            const nextState = redoStack.pop();
            board = nextState.board;
            notes = nextState.notes;

            if (redoStack.length === 0) {
                redoBtn.setAttribute('disabled', 'true');
            }
            updateKeypadCounts();
            renderBoard();
        });

        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const num = parseInt(btn.dataset.num, 10);
                handleInput(num);
            });
        });

        window.addEventListener('keydown', (e) => {
            if (isGameOver || isPaused) return;
            if (e.key >= '1' && e.key <= '9') {
                handleInput(parseInt(e.key, 10));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                eraseBtn.click();
            } else if (e.key === 'm' || e.key === 'M') {
                notesModeBtn.click();
            } else if (selectedCell !== null) {
                let r = Math.floor(selectedCell / 9);
                let c = selectedCell % 9;
                if (e.key === 'ArrowUp') r = (r + 8) % 9;
                else if (e.key === 'ArrowDown') r = (r + 1) % 9;
                else if (e.key === 'ArrowLeft') c = (c + 8) % 9;
                else if (e.key === 'ArrowRight') c = (c + 1) % 9;
                else return;
                selectCell(r * 9 + c);
            }
        });

        // ==================== SUDOKU GENERATOR & VALIDATOR ENGINE ====================
        let clearedPuzzles = JSON.parse(localStorage.getItem('sudoku_10k_cleared_puzzles') || '{}');
        let batchOffset = parseInt(localStorage.getItem('sudoku_10k_batch_offset') || '0', 10);
        const ITEMS_PER_PAGE = 100;
        let currentPage = 1;

        // Simple seedable random number generator (PRNG)
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
        }

        function stringToSeed(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
            }
            return hash;
        }

        // Check if a cell has duplicate number in row, col, or 3x3 block
        function isCellConflicting(idx) {
            const val = board[idx];
            if (val === 0) return false;

            const r = Math.floor(idx / 9);
            const c = idx % 9;

            // Check row & col
            for (let i = 0; i < 9; i++) {
                if (i !== c && board[r * 9 + i] === val) return true;
                if (i !== r && board[i * 9 + c] === val) return true;
            }

            // Check 3x3 block
            const boxR = Math.floor(r / 3) * 3;
            const boxC = Math.floor(c / 3) * 3;
            for (let br = boxR; br < boxR + 3; br++) {
                for (let bc = boxC; bc < boxC + 3; bc++) {
                    const checkIdx = br * 9 + bc;
                    if (checkIdx !== idx && board[checkIdx] === val) return true;
                }
            }
            return false;
        }

        // Generate full valid grid using backtracking with seeded RNG
        function fillGrid(grid, rng) {
            for (let i = 0; i < 81; i++) {
                if (grid[i] === 0) {
                    const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                    // Shuffle with RNG
                    for (let j = nums.length - 1; j > 0; j--) {
                        const k = Math.floor(rng() * (j + 1));
                        [nums[j], nums[k]] = [nums[k], nums[j]];
                    }

                    for (const num of nums) {
                        const r = Math.floor(i / 9);
                        const c = i % 9;
                        let valid = true;

                        for (let k = 0; k < 9; k++) {
                            if (grid[r * 9 + k] === num || grid[k * 9 + c] === num) {
                                valid = false;
                                break;
                            }
                        }

                        if (valid) {
                            const boxR = Math.floor(r / 3) * 3;
                            const boxC = Math.floor(c / 3) * 3;
                            for (let br = boxR; br < boxR + 3 && valid; br++) {
                                for (let bc = boxC; bc < boxC + 3; bc++) {
                                    if (grid[br * 9 + bc] === num) {
                                        valid = false;
                                        break;
                                    }
                                }
                            }
                        }

                        if (valid) {
                            grid[i] = num;
                            if (fillGrid(grid, rng)) return true;
                            grid[i] = 0;
                        }
                    }
                    return false;
                }
            }
            return true;
        }

        function generateSudoku(diff = 'easy', targetPuzzleId = null) {
            currentDifficulty = diff;
            hintUsedThisStage = false;
            hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            const diffLabels = {
                easy: 'Lv. 1 簡単',
                normal: 'Lv. 3 普通',
                hard: 'Lv. 6 難しい',
                expert: 'Lv. 8 高難度',
                master: 'Lv. 10 激ムズ'
            };
            const clueCounts = {
                easy: 42,
                normal: 36,
                hard: 30,
                expert: 26,
                master: 22
            };

            document.getElementById('level-display').textContent = diffLabels[diff];

            if (targetPuzzleId) {
                currentPuzzleId = targetPuzzleId;
            } else {
                const config = diffRangesConfig[diff];
                const randomNum = config.start + batchOffset + Math.floor(Math.random() * config.total);
                currentPuzzleId = '#' + randomNum;
            }
            document.getElementById('puzzle-id').textContent = currentPuzzleId;

            const seed = stringToSeed(currentPuzzleId + '_' + diff);
            const rng = mulberry32(seed);

            solution = new Array(81).fill(0);
            fillGrid(solution, rng);

            puzzle = [...solution];
            const indices = Array.from({ length: 81 }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[j]];
            }

            const cluesToKeep = clueCounts[diff];
            const toRemove = 81 - cluesToKeep;
            for (let i = 0; i < toRemove; i++) {
                puzzle[indices[i]] = 0;
            }

            board = [...puzzle];
            initialClues = puzzle.map(val => val !== 0);
            notes = Array.from({ length: 81 }, () => new Set());
            history = [];
            redoStack = [];
            selectedCell = null;
            selectedCellsSet.clear();

            undoBtn.setAttribute('disabled', 'true');
            redoBtn.setAttribute('disabled', 'true');

            updateKeypadCounts();
        }

        function updateKeypadCounts() {
            const counts = new Array(10).fill(9);
            for (let i = 0; i < 81; i++) {
                if (board[i] >= 1 && board[i] <= 9) {
                    counts[board[i]]--;
                }
            }

            document.querySelectorAll('.keypad-btn').forEach(btn => {
                const num = parseInt(btn.dataset.num, 10);
                const remainingSpan = btn.querySelector('.remaining-count');
                if (remainingSpan) {
                    const remaining = Math.max(0, counts[num]);
                    remainingSpan.textContent = remaining;
                    if (remaining === 0) {
                        btn.classList.add('opacity-40');
                    } else {
                        btn.classList.remove('opacity-40');
                    }
                }
            });
        }

        function startTimer() {
            stopTimer();
            timerSeconds = 0;
            timerDisplay.textContent = "00:00";
            timerInterval = setInterval(() => {
                if (!isPaused && !isGameOver) {
                    timerSeconds++;
                    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                    const s = String(timerSeconds % 60).padStart(2, '0');
                    timerDisplay.textContent = `${m}:${s}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Win condition: Check if all cells are filled and valid according to Sudoku rules (any valid arrangement is accepted)
        function checkWinCondition() {
            for (let i = 0; i < 81; i++) {
                if (board[i] === 0 || isCellConflicting(i)) return;
            }
            isGameOver = true;
            stopTimer();

            clearedPuzzles[currentPuzzleId] = {
                difficulty: currentDifficulty,
                time: timerDisplay.textContent,
                timestamp: Date.now()
            };
            localStorage.setItem('sudoku_10k_cleared_puzzles', JSON.stringify(clearedPuzzles));

            winTime.textContent = `タイム: ${timerDisplay.textContent}`;
            winOverlay.classList.remove('hidden');
        }

        const diffRangesConfig = {
            easy: { start: 1001, total: 2500 },
            normal: { start: 3501, total: 2500 },
            hard: { start: 6001, total: 2500 },
            expert: { start: 8501, total: 2500 },
            master: { start: 11001, total: 2500 }
        };

        function renderPuzzleList(diff, page) {
            puzzleListContainer.innerHTML = '';
            const config = diffRangesConfig[diff];
            const maxPages = Math.ceil(config.total / ITEMS_PER_PAGE);
            if (page < 1) page = 1;
            if (page > maxPages) page = maxPages;
            currentPage = page;

            const startIndex = config.start + batchOffset + (page - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, config.start + batchOffset + config.total);

            pageInfo.textContent = `ページ ${page} / ${maxPages} (#${startIndex}〜#${endIndex - 1})`;
            prevPageBtn.disabled = page === 1;
            nextPageBtn.disabled = page === maxPages;

            for (let idNum = startIndex; idNum < endIndex; idNum++) {
                const puzzleId = '#' + idNum;
                const isCleared = !!clearedPuzzles[puzzleId];

                const card = document.createElement('div');
                card.className = `p-2.5 rounded-xl border flex flex-col justify-between transition ${
                    isCleared 
                        ? 'bg-slate-100 border-slate-300 opacity-75' 
                        : 'bg-white border-slate-200 hover:border-blue-400 hover:shadow-md cursor-pointer'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-mono font-bold text-xs ${isCleared ? 'text-slate-500' : 'text-slate-800'}">${puzzleId}</span>
                        ${isCleared ? '<span class="text-[9px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded-full">CLEAR</span>' : '<span class="text-[9px] font-semibold bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded">未挑戦</span>'}
                    </div>
                    <div class="text-[11px] text-slate-500 flex justify-between items-end mt-1">
                        <span>${isCleared ? clearedPuzzles[puzzleId].time : '--:--'}</span>
                        <button class="px-2 py-0.5 text-[10px] rounded font-semibold ${
                            isCleared 
                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                                : 'bg-blue-500 text-white hover:bg-blue-600 active:scale-95'
                        }" ${isCleared ? 'disabled' : ''}>
                            ${isCleared ? '済' : '挑戦'}
                        </button>
                    </div>
                `;

                if (!isCleared) {
                    card.addEventListener('click', () => {
                        puzzleSelectModal.classList.add('hidden');
                        isGameOver = false;
                        isPaused = false;
                        pauseOverlay.classList.add('hidden');
                        winOverlay.classList.add('hidden');
                        generateSudoku(diff, puzzleId);
                        renderBoard();
                        startTimer();
                    });
                }

                puzzleListContainer.appendChild(card);
            }

            const totalCleared = Object.keys(clearedPuzzles).length;
            clearedStatsSummary.textContent = `総クリア済み: ${totalCleared} / 10,000 問`;

            const regenerateBatchBtn = document.getElementById('regenerate-batch-btn');
            if (totalCleared >= 10000) {
                regenerateBatchBtn.classList.remove('hidden');
            } else {
                regenerateBatchBtn.classList.add('hidden');
            }
        }

        const regenerateBatchBtn = document.getElementById('regenerate-batch-btn');
        regenerateBatchBtn.addEventListener('click', () => {
            if (confirm('すべての10,000問をクリアしました！新しく別のランダム問題セット（次の1万問）を生成しますか？')) {
                batchOffset += 10000;
                localStorage.setItem('sudoku_10k_batch_offset', batchOffset);
                clearedPuzzles = {};
                localStorage.removeItem('sudoku_10k_cleared_puzzles');
                currentPage = 1;
                renderPuzzleList(activeTab, currentPage);
            }
        });

        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                renderPuzzleList(activeTab, currentPage - 1);
            }
        });

        nextPageBtn.addEventListener('click', () => {
            const config = diffRangesConfig[activeTab];
            const maxPages = Math.ceil(config.total / ITEMS_PER_PAGE);
            if (currentPage < maxPages) {
                renderPuzzleList(activeTab, currentPage + 1);
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                    b.classList.add('text-slate-600');
                });
                btn.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                activeTab = btn.dataset.tab;
                currentPage = 1;
                renderPuzzleList(activeTab, currentPage);
            });
        });

        selectPuzzleBtn.addEventListener('click', () => {
            renderPuzzleList(activeTab, currentPage);
            puzzleSelectModal.classList.remove('hidden');
        });

        closePuzzleModal.addEventListener('click', () => {
            puzzleSelectModal.classList.add('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if (confirm('全てのクリア記録をリセットしてもよろしいですか？')) {
                clearedPuzzles = {};
                localStorage.removeItem('sudoku_10k_cleared_puzzles');
                renderPuzzleList(activeTab, currentPage);
            }
        });

        newGameBtn.addEventListener('click', () => {
            closeDiffModalBtn.classList.remove('hidden');
            difficultyModal.classList.remove('hidden');
        });

        closeDiffModalBtn.addEventListener('click', () => {
            difficultyModal.classList.add('hidden');
        });

        document.querySelectorAll('.difficulty-option').forEach(btn => {
            btn.addEventListener('click', () => {
                const diff = btn.dataset.level;
                difficultyModal.classList.add('hidden');
                titleScreen.classList.add('hidden');
                isGameOver = false;
                isPaused = false;
                pauseOverlay.classList.add('hidden');
                winOverlay.classList.add('hidden');
                generateSudoku(diff);
                renderBoard();
                startTimer();
            });
        });

        function renderBoard() {
            boardEl.innerHTML = '';
            const selectedVal = selectedCell !== null ? board[selectedCell] : 0;

            for (let i = 0; i < 81; i++) {
                const cell = document.createElement('div');
                const r = Math.floor(i / 9);
                const c = i % 9;
                const val = board[i];
                const isInitial = initialClues[i];
                const isSelected = selectedCell === i;
                const isMultiSelected = selectedCellsSet.has(i);
                const isSameNum = selectedVal !== 0 && val === selectedVal;
                const isError = !isInitial && val !== 0 && isCellConflicting(i);

                let borderClasses = '';
                if (c === 2 || c === 5) borderClasses += ' border-r-[4px] border-r-slate-900';
                if (r === 2 || r === 5) borderClasses += ' border-b-[4px] border-b-slate-900';

                let bgClass = 'bg-white';
                if (isError) {
                    bgClass = 'bg-rose-100 text-rose-600';
                } else if (isSelected) {
                    bgClass = 'bg-blue-300';
                } else if (isMultiSelected) {
                    bgClass = 'bg-purple-200';
                } else if (isSameNum) {
                    bgClass = 'bg-blue-100';
                } else if (selectedCell !== null && (Math.floor(selectedCell / 9) === r || (selectedCell % 9) === c || (Math.floor(Math.floor(selectedCell / 9) / 3) === Math.floor(r / 3) && Math.floor((selectedCell % 9) / 3) === Math.floor(c / 3)))) {
                    bgClass = 'bg-blue-50/70';
                }

                cell.className = 'relative flex items-center justify-center text-xl font-bold cursor-pointer transition-colors ' + bgClass + borderClasses;

                if (val !== 0) {
                    const span = document.createElement('span');
                    span.textContent = val;
                    if (isInitial) {
                        span.className = 'text-slate-900 font-extrabold';
                    } else if (isError) {
                        span.className = 'text-rose-600 font-bold';
                    } else {
                        span.className = 'text-blue-600 font-bold';
                    }
                    cell.appendChild(span);
                } else {
                    const noteSet = notes[i];
                    if (noteSet.size > 0) {
                        const noteGrid = document.createElement('div');
                        noteGrid.className = 'grid grid-cols-3 grid-rows-3 w-full h-full p-[2px] pointer-events-none';
                        for (let n = 1; n <= 9; n++) {
                            const noteCell = document.createElement('div');
                            noteCell.className = 'flex items-center justify-center text-[9px] font-mono text-slate-500 leading-none';
                            if (noteSet.has(n)) {
                                noteCell.textContent = n;
                            }
                            noteGrid.appendChild(noteCell);
                        }
                        cell.appendChild(noteGrid);
                    }
                }

                cell.addEventListener('click', () => {
                    selectCell(i);
                });

                boardEl.appendChild(cell);
            }
        }

        window.onload = function() {
            // Ensure title screen is visible on launch and modals are hidden
            titleScreen.classList.remove('hidden');
            difficultyModal.classList.add('hidden');
            puzzleSelectModal.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            winOverlay.classList.add('hidden');

            // Pre-generate puzzle in background so it's ready when user starts
            generateSudoku('easy', '#1001');
            renderBoard();
        };
    </script>
</body>
</html>
